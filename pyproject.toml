[project]
name = "sponsor-ai"
version = "0.1.0"
description = "Détection et saut automatique de segments sponsorisés dans les vidéos YouTube via embeddings et similarité cosine."
readme = "README.md"
authors = [
    { name = "Abdallah Nassur", email = "nassur1607@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "youtube-transcript-api>=1.0",
    "sentence-transformers>=4.0",
    "torch>=2.0",
    "google-genai>=1.74.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "pytest-asyncio>=0.26",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
