<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouSkipAI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-row">
        <h1><span class="logo-accent">YouSkip</span>AI</h1>
      </div>
      <p class="tagline">AI YouTube sponsor detector</p>
    </header>

    <!-- Toggle -->
    <section class="toggle-section">
      <label class="toggle-label" for="toggle-enabled">
        <span class="toggle-text">Detection On</span>
        <div class="toggle-switch">
          <input type="checkbox" id="toggle-enabled" checked>
          <span class="toggle-slider"></span>
        </div>
      </label>
    </section>

    <!-- Stats Dashboard (Restored) -->
    <section class="stats-section">
      <div class="stats-grid">
        <div class="stat-card">
          <span id="savedTime" class="stat-value">0s</span>
          <span class="stat-label">Time Saved</span>
        </div>
        <div class="stat-card">
          <span id="skipCount" class="stat-value">0</span>
          <span class="stat-label">Total Skips</span>
        </div>
      </div>
    </section>

    <!-- Status -->
    <section class="status-section" id="status-section">
      <div class="status-indicator" id="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Checking...</span>
      </div>
    </section>

    <!-- API Configuration -->
    <section class="config-section">
      <label class="config-label" for="api-url">API URL</label>
      <div class="input-row">
        <input
          type="url"
          id="api-url"
          placeholder="http://localhost:8000"
          spellcheck="false"
          autocomplete="off"
        >
        <button id="save-url" class="btn-save" title="Save">✓</button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>v1.0.0</span>
      <a href="https://github.com/NassAbd/youskip-ai" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
